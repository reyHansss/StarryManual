<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Starry手册 · 蓝图画布</title>
    <link rel="stylesheet" href="../vendor/blueprintue/render.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #151515;
        color: #aeb8c8;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      #playground {
        width: 100%;
        height: 100%;
      }
      .bue-render .frame {
        border: 0 !important;
      }
      .bue-render .frame-header {
        background: #20242b !important;
      }
      .bue-render .layer {
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: contain;
      }
      .bue-render .layer.is-panning {
        cursor: grabbing;
      }
      .bue-render .layer .canvas,
      .bue-render .layer .node {
        cursor: inherit !important;
      }
      .bue-render .layer [contenteditable='true'] {
        cursor: text;
        user-select: text;
        -webkit-user-select: text;
      }
      .bue-render .frame-header__buttons-reset:focus-visible {
        outline: 2px solid #80c4ff;
        outline-offset: -2px;
      }
      .bue-render .frame-header__buttons-fullscreen,
      .bue-render .frame-header__buttons-panel,
      .bue-render .frame-header__buttons-separator {
        display: none !important;
      }
      #message {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 25px;
        text-align: center;
        font-size: 12px;
        line-height: 1.8;
        background: #15191e;
      }
      #message[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="playground"></div>
    <div id="message">从 UE 复制一组节点，点击上方「粘贴节点」查看。</div>
    <script src="../vendor/blueprintue/render.js"></script>
    <script type="module">
      import { attachBlueprintNavigation } from './navigation.js';

      let renderer;
      let detachNavigation;
      let currentText;
      const playground = document.getElementById('playground');
      const message = document.getElementById('message');
      function render(text) {
        try {
          if (typeof text !== 'string' || text.length > 200000)
            throw new Error('节点文本超过 200,000 字符限制。');
          detachNavigation?.();
          detachNavigation = undefined;
          if (renderer) renderer.stop();
          playground.replaceChildren();
          renderer = new window.blueprintUE.render.Main(text, playground, {
            height: window.innerHeight + 'px',
          });
          renderer.start(function (success) {
            if (!success || !playground.querySelector('.node')) {
              message.textContent = '没有找到可显示的节点，请尝试完整的普通蓝图节点文本。';
              message.hidden = false;
              return;
            }
            detachNavigation = attachBlueprintNavigation(renderer, playground);
            currentText = text;
            message.hidden = true;
          });
        } catch (error) {
          message.textContent =
            '这段文本暂时无法显示。请从 UE 复制完整的一组普通蓝图节点后重新粘贴。';
          message.hidden = false;
        }
      }
      window.addEventListener('message', (event) => {
        if (
          event.origin !== window.location.origin ||
          event.source !== window.parent ||
          event.data?.type !== 'starry-blueprint'
        )
          return;
        render(event.data.text);
      });
      let resize;
      window.addEventListener('resize', () => {
        clearTimeout(resize);
        resize = setTimeout(() => {
          if (currentText) render(currentText);
        }, 150);
      });
    </script>
  </body>
</html>
