<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Starry手册 · 蓝图画布</title>
    <link rel="stylesheet" href="../vendor/blueprintue/render.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #151515;
        color: #aeb8c8;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      #playground {
        width: 100%;
        height: 100%;
      }
      .bue-render .frame {
        border: 0 !important;
      }
      .bue-render .frame-header {
        background: #20242b !important;
      }
      .bue-render .frame-header__breadcrumb {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .blueprint-view-button {
        flex-shrink: 0;
        padding: 3px 7px;
        border: 1px solid #48515e;
        border-radius: 6px;
        background: #2d333d;
        color: #d3dbe5;
        font:
          12px 'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        cursor: pointer;
        pointer-events: auto;
      }
      .blueprint-view-button:focus-visible {
        outline: 2px solid #80c4ff;
        outline-offset: 1px;
      }
      .blueprint-view-button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .bue-render .frame-header__breadcrumb {
        max-width: calc(100% - 170px);
        overflow-x: auto;
        white-space: nowrap;
      }
      .is-editing .layer .node {
        cursor: move !important;
      }
      .is-editing .node.layout-selected,
      .is-editing .node:focus-visible {
        outline: 2px solid #eaa3ba;
        outline-offset: 3px;
      }
      .bue-render .layer {
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: contain;
      }
      .bue-render .layer.is-panning {
        cursor: grabbing;
      }
      .bue-render .layer .canvas,
      .bue-render .layer .node {
        cursor: inherit !important;
      }
      .bue-render .layer [contenteditable='true'] {
        cursor: text;
        user-select: text;
        -webkit-user-select: text;
      }
      .bue-render .frame-header__buttons-reset:focus-visible {
        outline: 2px solid #80c4ff;
        outline-offset: -2px;
      }
      .bue-render .frame-header__buttons-fullscreen,
      .bue-render .frame-header__buttons-panel,
      .bue-render .frame-header__buttons-separator {
        display: none !important;
      }
      #message {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 25px;
        text-align: center;
        font-size: 12px;
        line-height: 1.8;
        background: #15191e;
      }
      #message[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="playground"></div>
    <div id="message">尚未提供节点文本。</div>
    <script src="../vendor/blueprintue/render.js"></script>
    <script type="module">
      import { attachBlueprintNavigation } from './navigation.js';
      import { createBlueprintEditing } from './editing.js';

      let renderer;
      let detachNavigation;
      let editing;
      let currentText;
      let currentEditable = false;
      let history = [];
      let historyIndex = -1;
      const playground = document.getElementById('playground');
      const message = document.getElementById('message');
      function clear() {
        detachNavigation?.();
        detachNavigation = undefined;
        editing?.dispose();
        editing = undefined;
        renderer?.stop();
        renderer = undefined;
        currentText = undefined;
        playground.replaceChildren();
        message.textContent = '尚未提供节点文本。';
        message.hidden = false;
      }
      function publish(text) {
        window.parent.postMessage(
          { type: 'starry-blueprint-change', text },
          window.location.origin,
        );
      }
      function render(text, editable = false, force = false, preserveView = false) {
        // 正文水合与 iframe 加载都会发送文本，同一组节点只初始化一次。
        if (!force && renderer && currentText === text && currentEditable === editable) return;
        const transform = preserveView && playground.querySelector('.canvas')?.style.transform;
        clear();
        try {
          if (typeof text !== 'string' || text.length > 200000)
            throw new Error('节点文本超过 200,000 字符限制。');
          if (!text.trim()) return;
          const activeRenderer = new window.blueprintUE.render.Main(text, playground, {
            height: window.innerHeight + 'px',
          });
          renderer = activeRenderer;
          currentText = text;
          currentEditable = editable;
          activeRenderer.start(function (success) {
            if (renderer !== activeRenderer) return;
            if (!success || !playground.querySelector('.node')) {
              message.textContent = '没有找到可显示的节点，请尝试完整的普通蓝图节点文本。';
              message.hidden = false;
              return;
            }
            const fitButton = document.createElement('button');
            fitButton.type = 'button';
            fitButton.textContent = '适应画布';
            fitButton.className = 'blueprint-view-button';
            const actualSizeButton = document.createElement('button');
            actualSizeButton.type = 'button';
            actualSizeButton.textContent = '100%';
            actualSizeButton.setAttribute('aria-label', '蓝图原始大小');
            actualSizeButton.className = 'blueprint-view-button';
            const buttons = [fitButton, actualSizeButton];
            if (editable) {
              const straightenButton = document.createElement('button');
              straightenButton.type = 'button';
              straightenButton.className = 'blueprint-view-button';
              straightenButton.textContent = '拉直连线';
              const undo = document.createElement('button');
              undo.type = 'button';
              undo.className = 'blueprint-view-button';
              undo.textContent = '撤销';
              undo.setAttribute('aria-label', '撤销排版');
              const redo = document.createElement('button');
              redo.type = 'button';
              redo.className = 'blueprint-view-button';
              redo.textContent = '重做';
              redo.setAttribute('aria-label', '重做排版');
              const updateHistory = () => {
                undo.disabled = historyIndex <= 0;
                redo.disabled = historyIndex >= history.length - 1;
              };
              editing = createBlueprintEditing(
                playground,
                () => currentText,
                (next) => {
                  currentText = next;
                  history = [...history.slice(0, historyIndex + 1), next].slice(-30);
                  historyIndex = history.length - 1;
                  updateHistory();
                  publish(next);
                },
              );
              straightenButton.onclick = () => editing.straighten();
              for (const [button, step] of [
                [undo, -1],
                [redo, 1],
              ]) {
                button.onclick = () => {
                  historyIndex += step;
                  const next = history[historyIndex];
                  render(next, true, true, true);
                  publish(next);
                };
              }
              updateHistory();
              buttons.push(straightenButton, undo, redo);
            }
            playground.querySelector('.frame-header__breadcrumb').replaceChildren(...buttons);
            detachNavigation = attachBlueprintNavigation(activeRenderer, playground, {
              fitButton,
              actualSizeButton,
              nodeEditing: editing,
            });
            if (transform) {
              const view = new DOMMatrixReadOnly(transform);
              activeRenderer.moveTo(view.e, view.f, view.a);
              playground.querySelector('.frame-header__current-zoom').textContent =
                `${Math.round(view.a * 100)}%`;
            }
            message.hidden = true;
          });
        } catch (error) {
          message.textContent =
            '这段节点文本暂时无法显示，可展开下方原始文本核对，或从 UE 重新复制完整节点。';
          message.hidden = false;
        }
      }
      window.addEventListener('message', (event) => {
        if (
          event.origin !== window.location.origin ||
          event.source !== window.parent ||
          event.data?.type !== 'starry-blueprint'
        )
          return;
        const editable = event.data.editable === true;
        if (event.data.text !== currentText || editable !== currentEditable) {
          history = [event.data.text];
          historyIndex = 0;
        }
        render(event.data.text, editable);
      });
      let resize;
      window.addEventListener('resize', () => {
        clearTimeout(resize);
        resize = setTimeout(() => {
          if (currentText) render(currentText, currentEditable, true);
        }, 150);
      });
    </script>
  </body>
</html>
